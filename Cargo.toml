[package]
name = "ntfy"
version = "0.1.0"
edition = "2021"
default-run = "ntfy"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
web-push = "0.10"
dotenvy = "0.15"
p256 = "0.13"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
