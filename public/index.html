<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Avisos</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root { --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#666; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#9a9aa0; --accent:#3b82f6; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:1rem; background:var(--bg); color:var(--text);
           font:16px/1.4 -apple-system, system-ui, sans-serif; max-width:640px; margin-inline:auto; }
    h1 { font-size:1.5rem; }
    button { width:100%; padding:.8rem; font-size:1rem; border:0; border-radius:10px;
             background:var(--accent); color:#fff; margin-bottom:.5rem; }
    button.secondary { background:var(--card); color:var(--text); }
    button:disabled { opacity:.5; }
    #status { color:var(--muted); font-size:.9rem; min-height:1.2em; }
    ul { list-style:none; padding:0; }
    li { background:var(--card); border-radius:12px; padding:.8rem 1rem; margin-bottom:.6rem; }
    .title { font-weight:600; }
    .body { margin-top:.2rem; word-break:break-word; }
    .time { color:var(--muted); font-size:.8rem; margin-top:.3rem; }
    input { width:100%; padding:.8rem; font-size:1.4rem; letter-spacing:.3em; text-align:center;
            border:1px solid var(--muted); border-radius:10px; background:var(--card); color:var(--text);
            margin-bottom:.5rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <h1>Avisos</h1>
  <section id="pair" hidden>
    <p>Escribe el código de 8 dígitos que muestra <code>scripts/tunnel.sh</code> en tu Mac.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="00000000">
    <button id="pairBtn">Vincular</button>
  </section>
  <section id="main" hidden>
    <button id="enable">Activar notificaciones</button>
    <button id="test" class="secondary">Probar notificación (5s)</button>
  </section>
  <p id="status"></p>
  <ul id="list"></ul>
  <script src="/app.js"></script>
</body>
</html>
